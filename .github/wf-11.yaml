name: context variables practice
on: push
jobs:
  test-context:
    runs-on: ubuntu-latest
    steps:
      - name: using context variables
        run: |
          echo "this workflow triggered by ${{ github.actor}}
          echo "the repo name is ${{  github.repository}}
          echo " the branch is ${{ github.ref_name }}"
      - name: print env variables
        run: printenv
      - name: print latest commit id
        run: echo "$GITHUB_SHA"
